name: Web PR Build

# Build Flutter web cho pull requests vào main, nhưng KHÔNG deploy.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release
