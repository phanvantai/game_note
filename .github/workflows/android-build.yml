name: Android PR Build

# Build verification cho pull requests vào main: chạy đúng cùng pipeline build
# như release (gọi _android-build.yml) nhưng KHÔNG deploy. Mục đích là bắt sớm
# signing, Gradle, hoặc lỗi build trước khi merge.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_android-build.yml
    secrets: inherit
